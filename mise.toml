[tools]
python = "3.12"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the Python dependencies into .venv"
run = "uv sync"

[tasks.test]
description = "Run the tool tests"
depends = ["setup"]
run = "uv run pytest"

[tasks.verify]
description = "Check every part 3MF and project object against the STEP"
depends = ["setup"]
dir = "{{config_root}}/tools"
run = "uv run python -m cad.verify"

[tasks.export]
description = "Re-export parts from the STEP into their 3MFs, keeping placement: mise run export -- <part names>"
depends = ["setup"]
dir = "{{config_root}}/tools"
run = "uv run python -m cad.export"

[tasks.clearance]
description = "Check the counter gears against the body, the covers and each other"
depends = ["setup"]
dir = "{{config_root}}/tools"
run = "uv run python -m cad.clearance"

[tasks.guide]
description = "Print the hardware guide to Infidex-Hardware-Map.pdf"
run = [
  "uv sync --group guide",
  "uv run --group guide playwright install chromium-headless-shell",
  "uv run --group guide python docs/hardware-map/build.py",
]

[tasks.figures]
description = "Redraw the hardware guide figures that are drawn from the STEP"
run = [
  "uv sync --group guide",
  "uv run --group guide python docs/hardware-map/figures/drag_option.py",
]

[tasks.plates]
description = "Plates in the Bambu project: mise run plates -- list | add-plate <name> | rename-plate <plate> <name> | move <object> <plate>"
depends = ["setup"]
dir = "{{config_root}}/tools"
run = "uv run python -m cad.project"

[tasks.add]
description = "Add a new STEP solid to the 3MFs, placed like a sibling: mise run add -- <solid> --like <sibling> [--inlay <solid>] [--plate <n or name>]"
depends = ["setup"]
dir = "{{config_root}}/tools"
run = "uv run python -m cad.add"

[tasks.layout]
description = "Give each counter option its own plate in the Bambu project (safe to rerun)"
depends = ["setup"]
dir = "{{config_root}}/tools"
run = "uv run python -m cad.layout"
