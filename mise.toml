[tools]
python = "3.12"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the Python dependencies into .venv"
run = "uv sync"

[tasks.test]
description = "Run the tool tests"
depends = ["setup"]
run = "uv run pytest"

[tasks.verify]
description = "Check every part 3MF and project object against the STEP"
depends = ["setup"]
dir = "{{config_root}}/tools"
run = "uv run python -m cad.verify"
