name: verify

# checking every 3MF against the STEP takes several minutes, so it only runs when
# something that could break the 3MFs changes
on:
  push:
    paths:
      - "cad/**"
      - "3mf/**"
      - "tools/**"
      - "mise.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "cad/**"
      - "3mf/**"
      - "tools/**"
      - "mise.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: mise run verify
